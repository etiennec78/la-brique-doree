<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Brique Dorée</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div id="main-header">
            <img id="logo" src="./images/LOGO.png" alt="Logo d'une brique LEGO dorée">
            <h1>LA BRIQUE DOREE</h1>
            <a href="commands.html">
                <img id="cart" class="icon" src="./images/cart.svg" alt="Icône de panier de courses">
                <p id="cart_items" class="bubble">10</p>
            </a>
            <video class="video-background" autoplay muted loop>
                <source src="./images/Header_Background.mp4" type="video/mp4">
            </video>
        </div>
        <section id="navbar-header">
            <a href="index.html" id="navbarbutton">Accueil</a>
            <a href="presentation.html" id="navbarbutton">Nos produits</a>
            <a href="avis.html" id="navbarbutton">Avis</a>
            <a href="profile.html" id="navbarbutton">Livreur / Administrateur / Profil / Se connecter</a>
        </section>
    </header>

    <main>
        <div class="form-page">
            <h2></h2>
            <form action="/review" method="post">
                <p>Notez la qualité de la livraison :
                <label> 
                <input type="radio" name="delivery" value="star-one" />
                <input type="radio" name="delivery" value="star-two" />
                <input type="radio" name="delivery" value="star-three" checked="checked" />
                </label>
                </p>
                
                <p>Notez la qualité des produits :
                <label> 
                <input type="radio" name="food" value="star-one" />
                <input type="radio" name="food" value="star-two" />
                <input type="radio" name="food" value="star-three" checked="checked" />
                </label>
                </p>

                <p>Donnez votre avis général ici...
                <textarea name="text-review" cols="100" rows="10">
                </textarea>
                <button type="submit" class="btn">Envoyer</button>
                </p>
            </form>
            
        </div>
    </main>
    
    <footer>
        <a href="avis.html">Remonter en Haut de la page</a>

    </footer>
</body>

</html>
