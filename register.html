<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Brique Dorée - Inscription</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="form.css">
  </head>
  <body>
    <header>
        <div id="main-header">
            <img id="logo" src="./images/LOGO.png" alt="Logo d'une brique LEGO dorée">
            <h1>INSCRIPTION</h1>
            <video class="video-background" autoplay muted loop>
                <source src="./images/Header_Background.mp4" type="video/mp4">
            </video>
        </div>
        <section id="navbar-header">
            <a href="index.html" id="navbarbutton">Accueil</a>
            <a href="presentation.html" id="navbarbutton">Nos produits</a>
            <a href="avis.html" id="navbarbutton">Avis</a>
            <a href="profile.html" id="navbarbutton">Mon Profil</a>
        </section>
    </header>
    <main>
        <div class="form-page">
            <h2>Inscription</h2>
            <form action="/register" method="post">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">S'inscrire</button>
            </form>
            <p>Déjà un compte ? <a href="login.html">Connexion</a></p>
        </div>
    </main>
    <footer>
        <a href="register.html">Remonter en Haut de la page</a>

    </footer>
  </body>
</html>
