<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis - La Brique Dorée</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="avis.css">
</head>
<body>
    <header>
        <div id="main-header">
            <img id="logo" src="./images/LOGO.png" alt="Logo">
            <h1>NOS AVIS</h1>
            <a href="commands.html">
                <img id="cart" class="icon" src="./images/cart.svg">
                <p id="cart_items" class="bubble">10</p>
            </a>
            <video class="video-background" autoplay muted loop>
                <source src="./images/Header_Background.mp4" type="video/mp4">
            </video>
        </div>
        <section id="navbar-header">
            <a href="index.html" id="navbarbutton">Accueil</a>
            <a href="presentation.html" id="navbarbutton">Nos produits</a>
            <a href="avis.html" style="color: var(--lego); border-bottom: 2px solid var(--lego);" id="navbarbutton">Avis</a>
            <a href="profile.html" id="navbarbutton">Mon Profil</a>
        </section>
    </header>

    <main>
        <h2 id="reviews-title">~ Avis Clients ~</h2>

        <table class="review-block">
            <tr>
                <th class="user-name">JEAN DUPONT</th>
                <td class="user-ratings">
                    <p>Produits : <img class="stars" src="images/reviews/star-3.png"></p>
                    <p>Livraison : <img class="stars" src="images/reviews/star-3.png"></p>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="review-text">
                    <p>Excellent restaurant blablabla</p>
                </td>
            </tr>
        </table>

        <table class="review-block">
            <tr>
                <th class="user-name">MARIE</th>
                <td class="user-ratings">
                    <p>Produits : <img class="stars" src="images/reviews/star-3.png"></p>
                    <p>Livraison : <img class="stars" src="images/reviews/star-3.png"></p>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="review-text">
                    <p>C'était bon miam miam blabla venez je recommande</p>
                </td>
            </tr>
        </table>

        <form class="add-review">
            <table class="review-block">
                <tr>
                    <th class="user-name">LAISSER UN AVIS</th>
                    <td class="user-ratings">
                        Note : 
                        <select class="select-note">
                            <option>5 ★</option>
                            <option>4 ★</option>
                            <option>3 ★</option>
                            <option>2 ★</option>
                            <option>1 ★</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="review-text">
                        <textarea placeholder="Votre message..."></textarea>
                        <button type="submit" class="btn-send">Envoyer l'avis</button>
                    </td>
                </tr>
            </table>
        </form>
    </main>

    <footer></footer>
</body>
</html>
