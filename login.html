<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Brique Dorée - Connexion</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="form.css">
  </head>
  <body>
    <header>
        <div id="main-header">
            <img id="logo" src="./images/LOGO.png" alt="Logo d'une brique LEGO dorée">
            <h1>LA BRIQUE DOREE</h1>
        </div>
        <section id="navbar-header">
             <a href="index.html" id="navbarbutton">
                Accueil
            </a>
            <a href="presentation.html" id="navbarbutton">
                Nos produits
            </a>
            <a href="livraison.html" id="navbarbutton">

            </a>

            </a>
            <a href="profil.html" id="navbarbutton">
                Logo Profil
            </a>
        </section>
    </header>
    <main>
        <div class="form-page">
            <h2>Connexion</h2>
            <form action="/login" method="post">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">Se connecter</button>
            </form>
            <p>Pas encore de compte ? <a href="register.html">Inscrivez-vous</a></p>
        </div>
    </main>
    <footer>
    </footer>
  </body>
</html>
