<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Brique Dorée - Profil</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="form.css">
    <link rel="stylesheet" href="profile.css">
  </head>
  <body>
    <header>
        <div id="main-header">
            <img id="logo" src="./images/LOGO.png" alt="Logo d'une brique LEGO dorée">
            <h1>LA BRIQUE DOREE</h1>
            <a href="commands.html">
                <img id="cart" class="icon" src="./images/cart.svg" alt="Icône de panier de courses">
                <p id="cart_items" class="bubble">10</p>
            </a>
            <video class="video-background" autoplay muted loop>
                <source src="./images/Header_Background.mp4" type="video/mp4">
            </video>
        </div>
        <section id="navbar-header">
            <a href="index.html" id="navbarbutton">Accueil</a>
            <a href="presentation.html" id="navbarbutton">Nos produits</a>
            <a href="avis.html" id="navbarbutton">Avis</a>
            <a href="profile.html" id="navbarbutton">Livreur / Administrateur / Profil / Se connecter</a>
        </section>
    </header>
    <main>
        <div class="form-page">
            <h2>Profil</h2>
            <form action="/update-profile" method="post">
                <div class="input-group">
                    <label for="marital-status">État civil</label>
                    <select name="marital-status" id="marital-status">
                        <option value="mr">Monsieur</option>
                        <option value="ms">Madame</option>
                        <option value="other">Autre</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="name">Nom</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="input-group">
                    <label for="surname">Prénom</label>
                    <input type="text" id="surname" name="surname" required>
                </div>
                <div class="input-group">
                    <label for="address">Adresse</label>
                    <input type="text" id="address" name="address" required>
                </div>
                <div class="input-group">
                   
                    <label for="address">Code postal</label>
                    <input type="number" id="postal-code" name="postal-code" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="intercom">Code interphone (optionnel)</label>
                    <input type="text" id="intercom" name="intercom">
                </div>
                <button type="submit" class="btn">Mettre à jour les informations</button>
            </form>
        </div>
    </main>
    <footer>
        <a href="profil.html">Remonter en Haut de la page</a>

    </footer>
  </body>
</html>
